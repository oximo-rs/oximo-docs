{# Version Picker Dropdown (docs mode only) #}
{% set is_dev = config.extra.channel | default(value="stable") == "dev" %}
{% set current_version = config.extra.versions.current | default(value="latest") %}

<div class="version-picker">
    <button class="version-picker__button" aria-haspopup="menu" aria-expanded="false" aria-label="Select documentation version">
        {% if is_dev %}
        <span>dev</span>
        <span class="version-picker__badge">unreleased</span>
        {% else %}
        <span>v{{ current_version }}</span>
        <span class="version-picker__badge">latest</span>
        {% endif %}
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
        </svg>
    </button>

    <div class="version-picker__dropdown" role="menu" aria-label="Documentation versions">
        <a href="{{ config.extra.dev_url | safe }}" class="version-picker__item {% if is_dev %}active{% endif %}" role="menuitem"{% if is_dev %} aria-current="true"{% endif %}>
            dev
            <span class="version-picker__badge">unreleased</span>
        </a>
        <a href="{{ config.extra.stable_url | safe }}" class="version-picker__item {% if not is_dev %}active{% endif %}" role="menuitem"{% if not is_dev %} aria-current="true"{% endif %}>
            v{{ config.extra.stable_version }}
            <span class="version-picker__badge">stable</span>
        </a>
    </div>
</div>
